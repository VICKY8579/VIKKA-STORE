<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIKKA Store | Checkout</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;color:#202938;margin:0}
header{background:#142b4a;color:white;padding:15px;display:flex;align-items:center;gap:12px}
header img{width:55px;height:55px;object-fit:contain;background:white;border-radius:8px}
main{max-width:650px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;margin:15px 0;border-radius:15px;box-shadow:0 2px 12px #ddd}
input,textarea{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{background:#ffbd45;border:0;padding:15px;width:100%;border-radius:9px;font-size:17px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.qr{max-width:190px;width:100%;display:block;margin:15px auto}
.muted{color:#666}
#message{overflow-wrap:anywhere}
</style>
</head>

<body>

<header>
<img src="VIKKA-STORE-LOGO.jpeg" alt="VIKKA Store">
<strong>VIKKA STORE — Checkout</strong>
</header>

<main>

<div class="card">
<h2>Delivery Details</h2>
<input id="name" placeholder="Customer Name">
<input id="mobile" placeholder="Mobile Number" maxlength="10" inputmode="numeric">
<textarea id="address" placeholder="Full Delivery Address"></textarea>
<input id="pin" placeholder="PIN Code" maxlength="6" inputmode="numeric">
</div>

<div class="card">
<h2>Order Summary</h2>
<div id="items">Loading cart...</div>
<h3 id="total"></h3>
</div>

<div class="card">
<h2>Pay Seller Directly</h2>
<p class="muted">Pay each seller separately using their payment details.</p>
<div id="sellerPayments">Loading seller details...</div>
</div>

<div class="card">
<h2>Place Order</h2>
<input id="utr" placeholder="UPI Transaction / UTR Number">
<button id="orderButton" onclick="placeOrder()">Place Order</button>
<p id="message"></p>
</div>

</main>

<script>
const SUPABASE_URL='https://izjlpgpvrmvhcefxulhj.supabase.co';
const SUPABASE_KEY='sb_publishable__8amspsA0ewjZXZomxX8Nw_5YE14um-';

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let cart=[];
let sellerData=[];
let orderInProgress=false;

try{
 cart=JSON.parse(localStorage.getItem('vikka_cart')||'[]');
 if(!Array.isArray(cart)) cart=[];
}catch(e){
 cart=[];
}

function price(p){
 return Number(p.price||p.selling_price||0);
}

function productName(p){
 return p.name||p.title||'Product';
}

function quantity(p){
 return Math.max(1,Number(p.quantity)||1);
}

function render(){
 let total=0;

 document.getElementById('items').innerHTML=cart.map(p=>{
  const sub=price(p)*quantity(p);
  total+=sub;

  return '<p>'+escapeHTML(productName(p))+
   ' × '+quantity(p)+' — ₹'+sub.toFixed(2)+'</p>';
 }).join('')||'Your cart is empty.';

 document.getElementById('total').textContent=
  'Total: ₹'+total.toFixed(2);
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,char=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 })[char]);
}

async function loadSellers(){
 const box=document.getElementById('sellerPayments');

 if(!cart.length){
  box.textContent='Your cart is empty.';
  return;
 }

 let ids=[...new Set(cart.map(p=>p.seller_id).filter(Boolean))];

 const missing=cart.filter(p=>!p.seller_id);

 if(missing.length){
  const productIds=missing.map(p=>p.id).filter(Boolean);

  if(productIds.length){
   const result=await db.from('seller_products')
    .select('id,seller_id')
    .in('id',productIds);

   if(!result.error && result.data){
    result.data.forEach(product=>{
     const item=cart.find(p=>String(p.id)===String(product.id));
     if(item && product.seller_id){
      item.seller_id=product.seller_id;
     }
    });
   }
  }
 }

 ids=[...new Set(cart.map(p=>p.seller_id).filter(Boolean))];

 if(!ids.length){
  box.textContent='Seller ID is missing from cart products. Please contact VIKKA Store.';
  return;
 }

 if(cart.some(p=>!p.seller_id)){
  box.textContent='Some products are not linked to a seller. Please contact VIKKA Store before ordering.';
  return;
 }

 const {data,error}=await db.from('public_seller_payments')
  .select('id,shop_name,full_name,payment_upi_id,payment_qr_url')
  .in('id',ids);

 if(error){
  box.textContent='Seller details could not be loaded: '+error.message;
  return;
 }

 sellerData=data||[];

 box.innerHTML=sellerData.map(s=>{
  return '<h3>'+escapeHTML(s.shop_name||s.full_name||'Seller')+'</h3>'+
   (s.payment_upi_id
    ?'<p>UPI ID: '+escapeHTML(s.payment_upi_id)+'</p>'
    :'<p>UPI ID not added</p>')+
   (s.payment_qr_url
    ?'<img class="qr" src="'+escapeHTML(s.payment_qr_url)+'" alt="Seller QR Code">'
    :'<p>QR code not added</p>');
 }).join('');
}

async function placeOrder(){

 if(orderInProgress) return;

 const n=document.getElementById('name').value.trim();
 const m=document.getElementById('mobile').value.trim();
 const a=document.getElementById('address').value.trim();
 const pin=document.getElementById('pin').value.trim();
 const utr=document.getElementById('utr').value.trim();

 const message=document.getElementById('message');
 const button=document.getElementById('orderButton');

 if(!cart.length){
  alert('Your cart is empty.');
  return;
 }

 if(!n||!/^[0-9]{10}$/.test(m)||!a||!/^[0-9]{6}$/.test(pin)){
  alert('Please enter valid name, 10-digit mobile, full address and 6-digit PIN.');
  return;
 }

 if(cart.some(p=>!p.seller_id)){
  alert('Seller ID is missing from one or more products. Order cannot be placed safely.');
  return;
 }

 if(cart.some(p=>!productName(p)||!Number.isFinite(price(p))||price(p)<=0)){
  alert('A product has an invalid name or price. Please check your cart.');
  return;
 }

 const groups={};

 cart.forEach(p=>{
  if(!groups[p.seller_id]){
   groups[p.seller_id]=[];
  }
  groups[p.seller_id].push(p);
 });

 orderInProgress=true;
 button.disabled=true;
 button.textContent='Submitting Order...';
 message.textContent='Please wait. Your order is being submitted.';

 try{

  const sellerIds=Object.keys(groups);
  const createdOrders=[];

  for(const sellerId of sellerIds){

   const products=groups[sellerId];

   const subtotal=products.reduce(
    (sum,p)=>sum+price(p)*quantity(p),0
   );

   // Generate Order ID before inserting.
   // No SELECT permission is required to retrieve the order ID.
   const orderId=crypto.randomUUID();

   const {error:orderError}=await db
    .from('store_orders')
    .insert({
     id:orderId,
     seller_id:sellerId,
     customer_name:n,
     customer_mobile:m,
     delivery_address:a,
     pin_code:pin,
     subtotal:subtotal,
     payment_utr:utr||null,
     payment_status:'pending',
     order_status:'pending'
    });

   if(orderError){
    throw new Error(
     'Order could not be saved: '+orderError.message
    );
   }

   const orderItems=products.map(p=>({
    order_id:orderId,
    product_id:p.id||null,
    product_name:productName(p),
    quantity:quantity(p),
    unit_price:price(p)
   }));

   const {error:itemError}=await db
    .from('store_order_items')
    .insert(orderItems);

   if(itemError){
    throw new Error(
     'Order was created, but its products could not be saved: '+
     itemError.message
    );
   }

   createdOrders.push(orderId);
  }

  localStorage.removeItem('vikka_cart');

  message.textContent=
   'Order submitted successfully! Please wait for seller confirmation.';

  document.getElementById('items').textContent='Order submitted.';
  document.getElementById('total').textContent='';
  document.getElementById('sellerPayments').textContent=
   'Thank you for shopping with VIKKA Store.';

  button.textContent='Order Submitted';

 }catch(error){

  message.textContent='Order error: '+error.message;

  orderInProgress=false;
  button.disabled=false;
  button.textContent='Place Order';
 }
}

render();
loadSellers();

</script>
</body>
</html>
