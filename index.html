<!DOCTYPE html>
<html lang="en">
<head><link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIKKA Store | Online Shopping</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #222; background: #f6f7f9; }
    header { background: #142b4a; color: white; padding: 18px 5%; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
    .logo { font-size: 28px; font-weight: bold; letter-spacing: 1px; }
    .logo span { color: #ffbd45; }
    .cart { background: #ffbd45; color: #142b4a; border: 0; padding: 11px 17px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .search-area { padding: 18px 5%; background: white; }
    #search { width: 100%; max-width: 650px; display: block; margin: auto; padding: 13px; border: 1px solid #ccc; border-radius: 7px; font-size: 16px; }
    .hero { margin: 22px 5%; padding: 35px 25px; border-radius: 12px; background: linear-gradient(120deg,#17395f,#2874a6); color: white; }
    .hero h1 { margin: 0 0 10px; font-size: 30px; }
    .hero p { margin: 0; font-size: 16px; }
    main { padding: 5px 5% 40px; }
    h2 { color: #142b4a; }
    #categories { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 20px; }
    .category { padding: 9px 15px; border: 1px solid #142b4a; border-radius: 20px; background: white; cursor: pointer; }
    .category.active { background: #142b4a; color: white; }
    #productGrid { display: grid; grid-template-columns: repeat(auto-fill,minmax(190px,1fr)); gap: 18px; }
    .product-card { background: white; border-radius: 10px; padding: 13px; box-shadow: 0 2px 9px #00000012; }
    .product-card img { width: 100%; height: 175px; object-fit: contain; background: #f3f3f3; border-radius: 7px; }
    .product-card h3 { font-size: 17px; margin: 12px 0 7px; }
    .price { color: #087443; font-size: 19px; font-weight: bold; }
    .add-btn { width: 100%; margin-top: 10px; padding: 11px; border: 0; border-radius: 6px; background: #142b4a; color: white; cursor: pointer; }
    .status { padding: 25px; background: white; border-radius: 8px; text-align: center; }
    footer { background: #142b4a; color: white; text-align: center; padding: 22px; }
    @media(max-width:500px) { .hero h1 { font-size: 24px; } .logo { font-size: 24px; } }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="logo">VIKKA<span> STORE</span></div>
      <button class="cart" onclick="showCart()">Cart (<span id="cartCount">0</span>)</button>
    </div>
  </header>

  <div class="search-area">
    <input id="search" type="search" placeholder="Search for products..." oninput="renderProducts()">
  </div>

  <section class="hero">
    <h1>Welcome to VIKKA Store</h1>
    <p>Discover great products at great prices.</p>
  </section>

  <main>
    <h2>Shop by Category</h2>
    <div id="categories"></div>
    <h2>All Products</h2>
    <div id="productGrid"><div class="status">Loading products...</div></div>
  </main>

  <footer>
    <strong>VIKKA STORE</strong>
    <p>Online Shopping Made Easy</p>
    <p>Contact us on WhatsApp: +91 85799 70090</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://izjlpgpvrmvhcefxulhj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8amspsA0ewiZXZomX8Nw_5YE14um-';
    const WHATSAPP_NUMBER = '918579970090';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allProducts = [];
    let selectedCategory = 'All';
    let cart = [];

    function safe(value) {
      return String(value ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
      })[c]);
    }

    async function loadProducts() {
      const grid = document.getElementById('productGrid');
      try {
        const { data, error } = await db.from('products').select('*').order('id', { ascending: false });
        if (error) throw error;
        allProducts = data || [];
        buildCategories();
        renderProducts();
      } catch (error) {
        console.error(error);
        grid.innerHTML = '<div class="status">Products could not be loaded. Please check the Supabase products table and access settings.</div>';
      }
    }

    function buildCategories() {
      const names = ['All', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
      document.getElementById('categories').innerHTML = names.map(name =>
        <button class="category ${name === selectedCategory ? 'active' : ''}" onclick="chooseCategory('${safe(name)}')">${name === 'All' ? 'All Products' : safe(name)}</button>
      ).join('');
    }

    function chooseCategory(name) {
      selectedCategory = name;
      buildCategories();
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const term = document.getElementById('search').value.toLowerCase();
      const filtered = allProducts.filter(p => {
        const name = p.name || p.title || p.product_name || 'Product';
        return (selectedCategory === 'All' || p.category === selectedCategory) &&
          String(name).toLowerCase().includes(term);
      });

      if (!filtered.length) {
        grid.innerHTML = '<div class="status">No products found.</div>';
        return;
      }

      grid.innerHTML = filtered.map((p, index) => {
        const name = p.name || p.title || p.product_name || 'Product';
        const price = p.price ?? p.selling_price ?? '';
        const image = p.image_url || p.image || p.photo || '';
        const description = p.description || '';
        return `<article class="product-card">
          <img src="${safe(image)}" alt="${safe(name)}" onerror="this.style.display='none'">
          <h3>${safe(name)}</h3>
          <p>${safe(description)}</p>
          <div class="price">${price !== '' ? '₹' + safe(price) : 'Price unavailable'}</div>
          <button class="add-btn" onclick="addToCart(${index})">Add to Cart</button>
        </article>`;
      }).join('');

      window.visibleProducts = filtered;
    }

    function addToCart(index) {
      const product = window.visibleProducts[index];
      if (!product) return;
      cart.push(product);
      document.getElementById('cartCount').textContent = cart.length;
      alert('Product added to cart!');
    }

    function showCart() {
      if (!cart.length) {
        alert('Your cart is empty.');
        return;
      }
      const lines = cart.map(p => ${p.name || p.title || p.product_name || 'Product'} - ₹${p.price ?? p.selling_price ?? 'N/A'});
      const message = 'Hello VIKKA Store, I want to order:\n' + lines.join('\n');
      if (confirm('Your cart has ' + cart.length + ' item(s). Continue to WhatsApp order?')) {
        window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(message), '_blank');
      }
    }

    loadProducts();
  </script>
</body>
</html>
