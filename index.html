<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#142b4a">
  <title>VIKKA Store | Online Shopping</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #222; background: #f6f7f9; }
    header { background: #142b4a; color: white; padding: 18px 5%; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
    .logo { font-size: 28px; font-weight: bold; letter-spacing: 1px; }
    .logo span { color: #ffbd45; }
    .cart { background: #ffbd45; color: #142b4a; border: 0; padding: 11px 17px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .search-area { padding: 18px 5%; background: white; }
    #search { width: 100%; max-width: 650px; display: block; margin: auto; padding: 13px; border: 1px solid #ccc; border-radius: 7px; font-size: 16px; }
    .hero { margin: 22px 5%; padding: 35px 25px; border-radius: 12px; background: linear-gradient(120deg,#17395f,#2874a6); color: white; }
    .hero h1 { margin: 0 0 10px; font-size: 30px; }
    .hero p { margin: 0; font-size: 16px; }
    main { padding: 5px 5% 40px; }
    h2 { color: #142b4a; }
    #categories { display: flex; gap: 9px; flex-wrap: wrap; margin-bottom: 20px; }
    .category { padding: 9px 15px; border: 1px solid #142b4a; border-radius: 20px; background: white; cursor: pointer; }
    .category.active { background: #142b4a; color: white; }
    #productGrid { display: grid; grid-template-columns: repeat(auto-fill,minmax(190px,1fr)); gap: 18px; }
    .product-card { background: white; border-radius: 10px; padding: 13px; box-shadow: 0 2px 9px #00000012; min-width: 0; }
    .product-card img { width: 100%; height: 175px; object-fit: contain; background: #f3f3f3; border-radius: 7px; }
    .product-card h3 { font-size: 17px; margin: 12px 0 7px; overflow-wrap: anywhere; }
    .product-card p { color: #555; font-size: 14px; }
    .price { color: #087443; font-size: 19px; font-weight: bold; }
    .mrp { color: #777; text-decoration: line-through; font-size: 13px; margin-left: 7px; }
    .add-btn { width: 100%; margin-top: 10px; padding: 11px; border: 0; border-radius: 6px; background: #142b4a; color: white; cursor: pointer; }
    .status { padding: 25px; background: white; border-radius: 8px; text-align: center; grid-column: 1 / -1; }
    footer { background: #142b4a; color: white; text-align: center; padding: 22px; }

    @media(max-width:500px) {
      .hero h1 { font-size: 24px; }
      .logo { font-size: 24px; }
      #productGrid { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; }
      .product-card { padding: 9px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="top">
      <div class="logo">VIKKA<span> STORE</span></div>
      <button class="cart" id="cartButton" type="button">
        Cart (<span id="cartCount">0</span>)
      </button>
    </div>
  </header>

  <div class="search-area">
    <input id="search" type="search"
      placeholder="Search for products..." aria-label="Search products">
  </div>

  <section class="hero">
    <h1>Welcome to VIKKA Store</h1>
    <p>Discover great products at great prices.</p>
  </section>

  <main>
    <h2>Shop by Category</h2>
    <div id="categories"></div>

    <h2>All Products</h2>
    <div id="productGrid">
      <div class="status">Loading products...</div>
    </div>
  </main>

  <footer>
    <strong>VIKKA STORE</strong>
    <p>Online Shopping Made Easy</p>
    <p>Contact us on WhatsApp: +91 85799 70090</p>
  </footer>

  <script>
    'use strict';

    const SUPABASE_URL = 'https://izjlpgpvrmvhcefxulhj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_8amspsA0ewiZXZomX8Nw_5YE14um-';
    const WHATSAPP_NUMBER = '918579970090';

    const productGrid = document.getElementById('productGrid');
    const categoriesElement = document.getElementById('categories');
    const searchInput = document.getElementById('search');
    const cartCountElement = document.getElementById('cartCount');

    let db = null;
    let allProducts = [];
    let visibleProducts = [];
    let selectedCategory = 'All';
    let cart = [];

    function showStatus(message) {
      productGrid.replaceChildren();

      const box = document.createElement('div');
      box.className = 'status';
      box.textContent = message;

      productGrid.appendChild(box);
    }

    function getProductName(product) {
      return String(
        product.name || product.title ||
        product.product_name || 'Product'
      );
    }

    function getProductPrice(product) {
      const value = product.price ?? product.selling_price;

      if (value === null || value === undefined || value === '') {
        return null;
      }

      return value;
    }

    function getImageUrl(product) {
      const value = product.image_url || product.image || product.photo || '';

      if (!value) return '';

      try {
        const parsed = new URL(String(value), window.location.href);

        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
          return parsed.href;
        }
      } catch (error) {
        console.warn('Invalid product image URL:', value);
      }

      return '';
    }

    function buildCategories() {
      categoriesElement.replaceChildren();

      const categoryNames = [...new Set(
        allProducts
          .map(product => String(product.category || '').trim())
          .filter(Boolean)
      )];

      const names = ['All', ...categoryNames];

      names.forEach(name => {
        const button = document.createElement('button');

        button.type = 'button';
        button.className = 'category' +
          (name === selectedCategory ? ' active' : '');

        button.textContent =
          name === 'All' ? 'All Products' : name;

        button.addEventListener('click', () => {
          selectedCategory = name;
          buildCategories();
          renderProducts();
        });

        categoriesElement.appendChild(button);
      });
    }

    function createProductCard(product, index) {
      const card = document.createElement('article');
      card.className = 'product-card';

      const imageUrl = getImageUrl(product);

      if (imageUrl) {
        const image = document.createElement('img');

        image.src = imageUrl;
        image.alt = getProductName(product);
        image.loading = 'lazy';

        image.onerror = () => {
          image.style.display = 'none';
        };

        card.appendChild(image);
      }

      const title = document.createElement('h3');
      title.textContent = getProductName(product);
      card.appendChild(title);

      const descriptionText = String(product.description || '');

      if (descriptionText) {
        const description = document.createElement('p');
        description.textContent = descriptionText;
        card.appendChild(description);
      }

      const priceLine = document.createElement('div');
      priceLine.className = 'price';

      const price = getProductPrice(product);

      priceLine.textContent =
        price === null ? 'Price unavailable' : '₹' + price;

      if (
        product.mrp !== null &&
        product.mrp !== undefined &&
        product.mrp !== '' &&
        Number(product.mrp) > Number(price)
      ) {
        const mrp = document.createElement('span');
        mrp.className = 'mrp';
        mrp.textContent = '₹' + product.mrp;
        priceLine.appendChild(mrp);
      }

      card.appendChild(priceLine);

      const addButton = document.createElement('button');
      addButton.type = 'button';
      addButton.className = 'add-btn';
      addButton.textContent = 'Add to Cart';

      addButton.addEventListener('click', () => {
        addToCart(index);
      });

      card.appendChild(addButton);

      return card;
    }

    function renderProducts() {
      const term = searchInput.value.trim().toLowerCase();

      const filtered = allProducts.filter(product => {
        const name = getProductName(product).toLowerCase();
        const description = String(
          product.description || ''
        ).toLowerCase();

        const category = String(product.category || '');

        const matchesCategory =
          selectedCategory === 'All' ||
          category === selectedCategory;

        const matchesSearch =
          name.includes(term) ||
          description.includes(term) ||
          category.toLowerCase().includes(term);

        return matchesCategory && matchesSearch;
      });

      visibleProducts = filtered;
      productGrid.replaceChildren();

      if (filtered.length === 0) {
        showStatus(
          allProducts.length === 0
            ? 'No products available yet.'
            : 'No products found.'
        );
        return;
      }

      filtered.forEach((product, index) => {
        productGrid.appendChild(
          createProductCard(product, index)
        );
      });
    }

    function addToCart(index) {
      const product = visibleProducts[index];

      if (!product) return;

      cart.push(product);
      cartCountElement.textContent = String(cart.length);

      alert(getProductName(product) + ' added to cart.');
    }

    function showCart() {
      if (cart.length === 0) {
        alert('Your cart is empty.');
        return;
      }

      const lines = cart.map((product, index) => {
        const price = getProductPrice(product);

        return (
          (index + 1) + '. ' +
          getProductName(product) + ' - ' +
          (price === null ? 'Price unavailable' : 'Rs. ' + price)
        );
      });

      const total = cart.reduce((sum, product) => {
        const price = Number(getProductPrice(product));

        return sum + (
          Number.isFinite(price) ? price : 0
        );
      }, 0);

      const message =
        'Hello VIKKA Store, I want to order:\n' +
        lines.join('\n') +
        '\nTotal: Rs. ' + total;

      const whatsappUrl =
        'https://wa.me/' + WHATSAPP_NUMBER +
        '?text=' + encodeURIComponent(message);

      window.open(
        whatsappUrl,
        '_blank',
        'noopener,noreferrer'
      );
    }

    async function loadProducts() {
      showStatus('Loading products...');

      if (
        !window.supabase ||
        typeof window.supabase.createClient !== 'function'
      ) {
        showStatus(
          'Store connection library could not load. Please refresh the page.'
        );
        return;
      }

      try {
        db = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const result = await db
          .from('products')
          .select('*');

        if (result.error) {
          throw result.error;
        }

        allProducts = Array.isArray(result.data)
          ? result.data
          : [];

        buildCategories();
        renderProducts();

      } catch (error) {
        console.error('Supabase product loading error:', error);

        showStatus(
          'Products could not be loaded. ' +
          (error.message ||
            'Please check the Supabase connection and table permissions.')
        );
      }
    }

    searchInput.addEventListener('input', renderProducts);

    document
      .getElementById('cartButton')
      .addEventListener('click', showCart);

    loadProducts();
  </script>
</body>
</html>
