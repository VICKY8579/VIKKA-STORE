<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIKKA Store | Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;font-family:Arial,sans-serif;color:#222}
header{background:#142b4a;color:white;padding:17px 4%;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h2{margin:0}
header a{color:#ffbd45;text-decoration:none}
button{border:0;border-radius:7px;padding:11px 15px;cursor:pointer;font-weight:bold}
.primary{background:#142b4a;color:white}
.gold{background:#ffbd45;color:#142b4a}
.danger{background:#ffe2e2;color:#a00000}
.success{background:#e0f5e8;color:#087443}
main{max-width:1150px;margin:25px auto;padding:0 15px}
.panel{background:white;padding:20px;border-radius:12px;box-shadow:0 2px 12px #0000000c;margin-bottom:20px}
h3{color:#142b4a;margin-top:0}
label{display:block;font-weight:bold;margin:12px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccd2dc;border-radius:7px;font-size:15px;background:white}
textarea{min-height:75px;resize:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px}
.stat{background:#edf3fa;padding:18px;border-radius:10px}
.stat strong{display:block;font-size:25px;color:#142b4a;margin-top:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{background:#e7edf5;color:#142b4a}
.tabs button.active{background:#142b4a;color:white}
.product,.order{border:1px solid #e3e7ed;border-radius:9px;padding:13px;margin:12px 0;display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.product img{width:75px;height:75px;object-fit:contain;background:#f1f1f1;border-radius:7px}
.details{flex:1;min-width:150px}
.actions{display:flex;gap:7px;flex-wrap:wrap}
.muted{font-size:13px;color:#697386}
.message{padding:12px;margin-top:12px;border-radius:7px;display:none;overflow-wrap:anywhere}
.message.error{display:block;background:#ffe9e9;color:#a00000}
.message.ok{display:block;background:#e3f7e9;color:#087443}
.hidden{display:none!important}
#loginPanel{max-width:450px;margin:55px auto}
small{color:#666}
@media(max-width:500px){
 header h2{font-size:19px}
 .panel{padding:15px}
 .product img{width:60px;height:60px}
}
</style>
</head>

<body>

<header>
  <h2>VIKKA STORE | Admin</h2>
  <div class="actions">
    <a href="index.html">View Store →</a>
    <button id="logoutButton" class="gold hidden">Logout</button>
  </div>
</header>

<main>

<section class="panel" id="loginPanel">
  <h3>Admin Login</h3>
  <label>Email Address</label>
  <input id="email" type="email" placeholder="Enter admin email">
  <label>Password</label>
  <input id="password" type="password" placeholder="Enter password">
  <button class="primary" id="loginButton" style="width:100%;margin-top:16px">Login Securely</button>
  <div id="loginMessage" class="message"></div>
  <p class="muted">Only an authorized VIKKA Store administrator can access this dashboard.</p>
</section>

<section id="dashboard" class="hidden">

  <div class="grid">
    <div class="stat">Total Products<strong id="totalProducts">0</strong></div>
    <div class="stat">Total Orders<strong id="totalOrders">0</strong></div>
    <div class="stat">Customers<strong id="totalCustomers">0</strong></div>
    <div class="stat">Sales Amount<strong id="totalSales">₹0</strong></div>
  </div>

  <section class="panel" style="margin-top:20px">
    <div class="tabs">
      <button class="active" data-tab="productsTab">Products</button>
      <button data-tab="ordersTab">Orders</button>
    </div>

    <div id="productsTab">
      <h3 id="formTitle">Add New Product</h3>

      <input type="hidden" id="productId">

      <div class="grid">
        <div>
          <label>Product Name *</label>
          <input id="name" placeholder="Product name">
        </div>
        <div>
          <label>Category *</label>
          <input id="category" placeholder="Clothing, Beauty, Toys">
        </div>
        <div>
          <label>Brand</label>
          <input id="brand" placeholder="Brand name">
        </div>
        <div>
          <label>Selling Price (₹) *</label>
          <input id="price" type="number" min="0" step="0.01">
        </div>
        <div>
          <label>MRP (₹)</label>
          <input id="mrp" type="number" min="0" step="0.01">
        </div>
        <div>
          <label>Stock Quantity</label>
          <input id="stock" type="number" min="0" step="1" value="0">
        </div>
        <div>
          <label>Delivery Information</label>
          <input id="delivery" placeholder="Example: 3-5 days">
        </div>
        <div>
          <label>Return Policy</label>
          <input id="returnPolicy" placeholder="Example: 7 days return">
        </div>
      </div>

      <label>Main Product Image URL</label>
      <input id="image_url" type="url" placeholder="https://example.com/product.jpg">

      <label>Product Description</label>
      <textarea id="description" placeholder="Write product details"></textarea>

      <label>
        <input id="is_active" type="checkbox" checked style="width:auto">
        Show this product in the store
      </label>

      <div class="actions" style="margin-top:15px">
        <button class="primary" id="saveButton">Save Product</button>
        <button class="gold" id="clearButton">Clear Form</button>
      </div>
      <div id="productMessage" class="message"></div>

      <hr style="border:0;border-top:1px solid #eee;margin:22px 0">

      <h3>Manage Products</h3>
      <button class="gold" id="refreshProducts">Refresh Products</button>
      <div id="productList">Loading products...</div>
    </div>

    <div id="ordersTab" class="hidden">
      <h3>Customer Orders</h3>
      <button class="gold" id="refreshOrders">Refresh Orders</button>
      <div id="orderList">Loading orders...</div>
    </div>
  </section>

</section>
</main>

<script>
'use strict';

const SUPABASE_URL = 'https://izjlpgpvrmvhcefxulhj.supabase.co';
const SUPABASE_KEY = 'sb_publishable__8amspsA0ewjZXZomxX8Nw_5YE14um-';

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let products = [];
let currentUser = null;

function message(id,text,type){
  const el = $(id);
  el.textContent = text;
  el.className = 'message ' + type;
}

function clearMessage(id){
  $(id).textContent = '';
  $(id).className = 'message';
}

function money(value){
  const n = Number(value || 0);
  return '₹' + n.toLocaleString('en-IN');
}

function safeImage(value){
  if(!value) return '';
  try{
    const url = new URL(value);
    return ['http:','https:'].includes(url.protocol) ? url.href : '';
  }catch{
    return '';
  }
}

async function login(){
  const email = $('email').value.trim();
  const password = $('password').value;

  if(!email || !password){
    message('loginMessage','Enter email and password.','error');
    return;
  }

  $('loginButton').disabled = true;
  $('loginButton').textContent = 'Checking...';

  try{
    const {data,error} = await db.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    currentUser = data.user;

    const {data:admin,error:adminError} = await db
      .from('store_admins')
      .select('user_id')
      .eq('user_id',currentUser.id)
      .maybeSingle();

    if(adminError) throw adminError;

    if(!admin){
      await db.auth.signOut();
      currentUser = null;
      throw new Error('This account is not authorized as a VIKKA administrator.');
    }

    $('loginPanel').classList.add('hidden');
    $('dashboard').classList.remove('hidden');
    $('logoutButton').classList.remove('hidden');

    await refreshDashboard();

  }catch(error){
    message('loginMessage',error.message || 'Login failed.','error');
  }finally{
    $('loginButton').disabled = false;
    $('loginButton').textContent = 'Login Securely';
  }
}

async function logout(){
  await db.auth.signOut();
  currentUser = null;
  $('dashboard').classList.add('hidden');
  $('logoutButton').classList.add('hidden');
  $('loginPanel').classList.remove('hidden');
  $('password').value = '';
  message('loginMessage','You have been logged out.','ok');
}

async function refreshDashboard(){
  await Promise.all([
    loadProducts(),
    loadOrders()
  ]);
}

async function loadProducts(){
  $('productList').textContent = 'Loading products...';

  try{
    const {data,error} = await db
      .from('products')
      .select('*')
      .order('id',{ascending:false});

    if(error) throw error;

    products = data || [];
    $('totalProducts').textContent = products.length;

    renderProducts();

  }catch(error){
    $('productList').textContent = 'Product loading failed: ' + error.message;
  }
}

function renderProducts(){
  const list = $('productList');
  list.replaceChildren();

  if(!products.length){
    list.textContent = 'No products found.';
    return;
  }

  products.forEach(product=>{
    const card = document.createElement('div');
    card.className = 'product';

    const image = document.createElement('img');
    const imageUrl = safeImage(product.image_url || product.image || '');

    if(imageUrl){
      image.src = imageUrl;
      image.alt = product.name || 'Product';
    }else{
      image.style.display = 'none';
    }

    image.onerror = ()=>image.style.display='none';

    const details = document.createElement('div');
    details.className = 'details';

    const title = document.createElement('strong');
    title.textContent = product.name || 'Product';

    const price = document.createElement('div');
    price.textContent = money(product.price);

    const info = document.createElement('div');
    info.className = 'muted';
    info.textContent =
      (product.category || '') +
      ' | Stock: ' + (product.stock ?? 'Not set') +
      ' | ' + (product.is_active === false ? 'Hidden' : 'Active');

    details.append(title,price,info);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const edit = document.createElement('button');
    edit.className = 'gold';
    edit.textContent = 'Edit';
    edit.onclick = ()=>editProduct(product.id);

    const del = document.createElement('button');
    del.className = 'danger';
    del.textContent = 'Delete';
    del.onclick = ()=>deleteProduct(product.id);

    actions.append(edit,del);
    card.append(image,details,actions);
    list.appendChild(card);
  });
}

function resetForm(){
  [
    'productId','name','category','brand','price','mrp',
    'stock','delivery','returnPolicy','image_url','description'
  ].forEach(id=>$(id).value='');

  $('stock').value = '0';
  $('is_active').checked = true;
  $('formTitle').textContent = 'Add New Product';
  clearMessage('productMessage');
}

function editProduct(id){
  const product = products.find(p=>String(p.id)===String(id));
  if(!product) return;

  $('productId').value = product.id;
  $('name').value = product.name || '';
  $('category').value = product.category || '';
  $('brand').value = product.brand || '';
  $('price').value = product.price ?? '';
  $('mrp').value = product.mrp ?? '';
  $('stock').value = product.stock ?? 0;
  $('delivery').value = product.delivery || '';
  $('returnPolicy').value = product.returnPolicy || '';
  $('image_url').value = product.image_url || product.image || '';
  $('description').value = product.description || '';
  $('is_active').checked = product.is_active !== false;

  $('formTitle').textContent = 'Edit Product';
  $('productsTab').scrollIntoView({behavior:'smooth'});
}

async function saveProduct(){
  clearMessage('productMessage');

  const id = $('productId').value;
  const name = $('name').value.trim();
  const category = $('category').value.trim();
  const price = Number($('price').value);
  const mrpValue = $('mrp').value;
  const stockValue = $('stock').value;
  const imageUrl = $('image_url').value.trim();

  if(!name || !category || $('price').value==='' ||
     !Number.isFinite(price) || price<0){
    message('productMessage','Enter a valid name, category and price.','error');
    return;
  }

  if(mrpValue!=='' && Number(mrpValue)<price){
    message('productMessage','MRP should not be less than selling price.','error');
    return;
  }

  if(stockValue!=='' && (!Number.isInteger(Number(stockValue)) || Number(stockValue)<0)){
    message('productMessage','Enter a valid stock quantity.','error');
    return;
  }

  if(imageUrl && !safeImage(imageUrl)){
    message('productMessage','Enter a valid HTTP or HTTPS image URL.','error');
    return;
  }

  const product = {
    name,
    category,
    brand: $('brand').value.trim(),
    price,
    mrp: mrpValue==='' ? null : Number(mrpValue),
    stock: stockValue==='' ? 0 : Number(stockValue),
    delivery: $('delivery').value.trim(),
    returnPolicy: $('returnPolicy').value.trim(),
    image_url: imageUrl,
    description: $('description').value.trim(),
    is_active: $('is_active').checked
  };

  $('saveButton').disabled = true;
  $('saveButton').textContent = 'Saving...';

  try{
    let result;

    if(id){
      result = await db.from('products').update(product).eq('id',id);
    }else{
      result = await db.from('products').insert([product]);
    }

    if(result.error) throw result.error;

    message('productMessage','Product saved successfully.','ok');
    resetForm();
    await loadProducts();

  }catch(error){
    message('productMessage','Save failed: ' + error.message,'error');
  }finally{
    $('saveButton').disabled = false;
    $('saveButton').textContent = 'Save Product';
  }
}

async function deleteProduct(id){
  const product = products.find(p=>String(p.id)===String(id));

  if(!product) return;

  if(!confirm('Delete ' + (product.name || 'this product') + '?')) return;

  try{
    const {error} = await db.from('products').delete().eq('id',id);
    if(error) throw error;

    await loadProducts();
    message('productMessage','Product deleted successfully.','ok');

  }catch(error){
    message('productMessage','Delete failed: ' + error.message,'error');
  }
}

async function loadOrders(){
  $('orderList').textContent = 'Loading orders...';

  try{
    const {data,error} = await db
      .from('orders')
      .select('*')
      .order('created_at',{ascending:false});

    if(error) throw error;

    const orders = data || [];

    $('totalOrders').textContent = orders.length;

    const total = orders.reduce((sum,order)=>{
      return sum + Number(order.total_amount || 0);
    },0);

    $('totalSales').textContent = money(total);

    const customers = new Set(
      orders.map(order=>order.phone).filter(Boolean)
    );

    $('totalCustomers').textContent = customers.size;

    renderOrders(orders);

  }catch(error){
    $('orderList').textContent =
      'Orders could not be loaded: ' + error.message;
  }
}

function renderOrders(orders){
  const list = $('orderList');
  list.replaceChildren();

  if(!orders.length){
    list.textContent = 'No orders received yet.';
    return;
  }

  orders.forEach(order=>{
    const card = document.createElement('div');
    card.className = 'order';

    const details = document.createElement('div');
    details.className = 'details';

    const title = document.createElement('strong');
    title.textContent = order.customer_name || 'Customer';

    const phone = document.createElement('div');
    phone.textContent = 'Phone: ' + (order.phone || 'Not available');

    const address = document.createElement('div');
    address.textContent = 'Address: ' + (order.address || 'Not available');

    const amount = document.createElement('div');
    amount.textContent = 'Amount: ' + money(order.total_amount);

    const date = document.createElement('div');
    date.className = 'muted';
    date.textContent = order.created_at
      ? new Date(order.created_at).toLocaleString()
      : '';

    const status = document.createElement('div');
    status.className = 'muted';
    status.textContent = 'Status: ' + (order.status || 'Not recorded');

    details.append(title,phone,address,amount,date,status);

    const items = document.createElement('pre');
    items.style.whiteSpace = 'pre-wrap';
    items.style.overflowWrap = 'anywhere';
    items.textContent = typeof order.items === 'string'
      ? order.items
      : JSON.stringify(order.items || [],null,2);

    card.append(details,items);
    list.appendChild(card);
  });
}

document.getElementById('loginButton').addEventListener('click',login);
document.getElementById('logoutButton').addEventListener('click',logout);
document.getElementById('saveButton').addEventListener('click',saveProduct);
document.getElementById('clearButton').addEventListener('click',resetForm);
document.getElementById('refreshProducts').addEventListener('click',loadProducts);
document.getElementById('refreshOrders').addEventListener('click',loadOrders);

document.querySelectorAll('[data-tab]').forEach(button=>{
  button.addEventListener('click',()=>{
    document.querySelectorAll('[data-tab]').forEach(item=>item.classList.remove('active'));
    button.classList.add('active');

    $('productsTab').classList.toggle('hidden',button.dataset.tab!=='productsTab');
    $('ordersTab').classList.toggle('hidden',button.dataset.tab!=='ordersTab');
  });
});
</script>

</body>
</html>
