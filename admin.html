<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIKKA Admin Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;font-family:Arial,sans-serif;color:#202b3c}
header{background:#101c35;color:white;padding:20px}
header h2{margin:0}
header p{color:#c5d1e5;margin:6px 0 0}
main{max-width:1150px;margin:auto;padding:16px}
.card{background:white;padding:19px;border-radius:13px;margin-bottom:17px;box-shadow:0 3px 14px #0000000b}
h3{margin-top:0}
input,select,textarea{width:100%;padding:12px;margin:6px 0 13px;border:1px solid #d8deea;border-radius:8px;font-size:15px}
textarea{min-height:85px}
label{font-weight:600;font-size:14px}
button{border:0;border-radius:8px;padding:11px 16px;background:#174b9b;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.green{background:#13844e}.red{background:#c63d3d}
.yellow{background:#e9a923;color:#222}.gray{background:#667085}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{background:#edf3ff;padding:17px;border-radius:10px}
.stat b{font-size:25px;display:block;margin-top:8px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.product{border:1px solid #e5e9f0;padding:12px;border-radius:10px;min-width:0}
.product img{width:100%;height:160px;object-fit:contain;background:#f5f5f5;border-radius:8px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actions button{padding:8px 11px}
#preview{max-width:160px;max-height:150px;object-fit:contain;display:none;margin:8px 0}
.muted{color:#777;font-size:13px}
@media(max-width:650px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<h2>🛍️ VIKKA ADMIN</h2>
<p>Store Management Dashboard</p>
</header>

<main>
<section class="card" id="loginBox">
<h3>Admin Login</h3>
<label>Email</label>
<input id="email" type="email" placeholder="Admin Email">
<label>Password</label>
<input id="password" type="password" placeholder="Password">
<button onclick="login()" id="loginBtn">Login</button>
<p id="loginMsg" class="muted"></p>
</section>

<div id="dashboard" class="hidden">

<section class="card">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
<h3>Welcome to VIKKA</h3>
<button class="red" onclick="logout()">Logout</button>
</div>
<div class="grid">
<div class="stat">Total Products<b id="total">0</b></div>
<div class="stat">Active Products<b id="active">0</b></div>
<div class="stat">Out of Stock<b id="outstock">0</b></div>
</div>
</section>

<section class="card">
<h3 id="formTitle">➕ Add New Product</h3>
<input type="hidden" id="editId">

<div class="row">
<div>
<label>Product Name *</label>
<input id="name" placeholder="Product Name">
</div>
<div>
<label>Category *</label>
<select id="category">
<option value="CLOTHING">Clothing</option>
<option value="GROCERY">Grocery</option>
<option value="BEAUTY">Beauty</option>
<option value="KIDS">Kids</option>
<option value="GENERAL">General</option>
<option value="ELECTRONICS">Electronics</option>
<option value="HOME">Home & Kitchen</option>
</select>
</div>
<div>
<label>Brand</label>
<input id="brand" placeholder="Brand Name">
</div>
</div>

<div class="row">
<div>
<label>Selling Price (₹) *</label>
<input id="price" type="number" min="0" placeholder="Selling Price">
</div>
<div>
<label>MRP (₹)</label>
<input id="mrp" type="number" min="0" placeholder="MRP">
</div>
<div>
<label>Stock Quantity</label>
<input id="stock" type="number" min="0" value="10">
</div>
</div>

<div class="row">
<div>
<label>Delivery Information</label>
<input id="delivery" value="7-10 DAYS">
</div>
<div>
<label>Return Policy</label>
<input id="returnPolicy" value="15 DAYS">
</div>
</div>

<label>Main Product Image URL *</label>
<input id="imageUrl" placeholder="https://example.com/product.jpg" oninput="previewImage()">
<img id="preview" alt="Product Preview">

<label>Product Description</label>
<textarea id="description" placeholder="Write product details..."></textarea>

<label style="display:block;margin:10px 0">
<input type="checkbox" id="isActive" checked style="width:auto;margin:0">
Show this product in the store
</label>

<div class="actions">
<button class="green" onclick="saveProduct()" id="saveBtn">Save Product</button>
<button class="yellow" onclick="clearForm()">Clear Form</button>
</div>
<p id="message" class="muted"></p>
</section>

<section class="card">
<h3>📦 Manage Products</h3>
<input id="search" placeholder="Search product by name or brand..." oninput="filterProducts()">
<select id="filterCategory" onchange="filterProducts()">
<option value="">All Categories</option>
<option>CLOTHING</option>
<option>GROCERY</option>
<option>BEAUTY</option>
<option>KIDS</option>
<option>GENERAL</option>
<option>ELECTRONICS</option>
<option>HOME</option>
</select>
<button class="yellow" onclick="loadProducts()">Refresh Products</button>
<div id="productList" class="grid" style="margin-top:15px"></div>
</section>
</div>
</main>

<script>
// YOUR ORIGINAL VIKKA SUPABASE PROJECT
const SUPABASE_URL = "https://izjlpgpvrmvhcefxulhj.supabase.co";

const SUPABASE_KEY = "sb_publishable_8amspsA0ewiZXZomX8Nw_5YE14um-";

const db = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let products = [];
let currentUser = null;

const el = id => document.getElementById(id);

async function login(){
 const email=el("email").value.trim();
 const password=el("password").value;

 if(!email || !password){
  el("loginMsg").textContent="Email and password required";
  return;
 }

 el("loginBtn").disabled=true;
 el("loginMsg").textContent="Checking login...";

 const {data,error}=await db.auth.signInWithPassword({
  email,password
 });

 if(error){
  el("loginMsg").textContent=error.message;
  el("loginBtn").disabled=false;
  return;
 }

 currentUser=data.user;

 const {data:admin,error:adminError}=await db
  .from("store_admins")
  .select("user_id")
  .eq("user_id",currentUser.id)
  .maybeSingle();

 if(adminError || !admin){
  await db.auth.signOut();
  currentUser=null;
  el("loginMsg").textContent="Admin authorization failed: "+(adminError?.message||"Not an admin");
  el("loginBtn").disabled=false;
  return;
 }

 showDashboard();
}

async function checkSession(){
 const {data}=await db.auth.getSession();

 if(data.session){
  currentUser=data.session.user;

  const {data:admin,error}=await db
   .from("store_admins")
   .select("user_id")
   .eq("user_id",currentUser.id)
   .maybeSingle();

  if(admin && !error){
   showDashboard();
   return;
  }

  await db.auth.signOut();
  currentUser=null;
 }
}

function showDashboard(){
 el("loginBox").classList.add("hidden");
 el("dashboard").classList.remove("hidden");
 el("loginBtn").disabled=false;
 loadProducts();
}

async function logout(){
 await db.auth.signOut();
 currentUser=null;
 el("dashboard").classList.add("hidden");
 el("loginBox").classList.remove("hidden");
 el("password").value="";
 el("loginBtn").disabled=false;
}

function previewImage(){
 const url=el("imageUrl").value.trim();
 const img=el("preview");
 if(!url){img.style.display="none";return}
 img.src=url;
 img.style.display="block";
 img.onerror=()=>{img.style.display="none"};
}

function clearForm(){
 el("editId").value="";
 ["name","brand","price","mrp","imageUrl","description"].forEach(id=>el(id).value="");
 el("category").value="CLOTHING";
 el("stock").value="10";
 el("delivery").value="7-10 DAYS";
 el("returnPolicy").value="15 DAYS";
 el("isActive").checked=true;
 el("preview").style.display="none";
 el("formTitle").textContent="➕ Add New Product";
 el("saveBtn").textContent="Save Product";
 el("message").textContent="";
}

async function saveProduct(){
 if(!currentUser){
  alert("Please login first");
  return;
 }

 const name=el("name").value.trim();
 const price=Number(el("price").value);
 const imageUrl=el("imageUrl").value.trim();
 const mrp=Number(el("mrp").value)||0;
 const stock=Number(el("stock").value);

 if(!name || !price || !imageUrl){
  alert("Product Name, Selling Price and Image URL are required.");
  return;
 }

 if(price<0 || mrp<0 || stock<0 || !Number.isFinite(stock)){
  alert("Enter valid positive values.");
  return;
 }

 const productData={
  name:name,
  category:el("category").value,
  brand:el("brand").value.trim(),
  price:price,
  mrp:mrp,
  stock:stock,
  delivery:el("delivery").value.trim(),
  returnPolicy:el("returnPolicy").value.trim(),
  description:el("description").value.trim(),
  image:imageUrl,
  image_url:imageUrl,
  is_active:el("isActive").checked
 };

 const id=el("editId").value;
 el("saveBtn").disabled=true;
 el("message").textContent="Saving product...";

 let result;

 if(id){
  result=await db.from("products").update(productData).eq("id",id);
 }else{
  result=await db.from("products").insert(productData);
 }

 el("saveBtn").disabled=false;

 if(result.error){
  el("message").textContent="Save failed: "+result.error.message;
  return;
 }

 el("message").textContent="Product saved successfully!";
 clearForm();
 await loadProducts();
}

async function loadProducts(){
 if(!currentUser)return;

 el("productList").innerHTML="Loading products...";

 const {data,error}=await db
  .from("products")
  .select("*")
  .order("id",{ascending:false});

 if(error){
  el("productList").textContent="Error: "+error.message;
  return;
 }

 products=data||[];

 el("total").textContent=products.length;
 el("active").textContent=products.filter(p=>p.is_active!==false).length;
 el("outstock").textContent=products.filter(p=>Number(p.stock)===0).length;

 filterProducts();
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function filterProducts(){
 const q=el("search").value.toLowerCase();
 const cat=el("filterCategory").value;

 const filtered=products.filter(p=>
  (!cat || p.category===cat) &&
  ((p.name||"").toLowerCase().includes(q) ||
   (p.brand||"").toLowerCase().includes(q))
 );

 el("productList").innerHTML=filtered.map(p=>`
 <div class="product">
  <img src="${escapeHTML(p.image || p.image_url || "")}"
   onerror="this.style.display='none'" alt="Product">
  <h4>${escapeHTML(p.name||"")}</h4>
  <p>Brand: ${escapeHTML(p.brand||"-")}</p>
  <b>₹${Number(p.price||0)}</b>
  <p class="muted">MRP: ₹${Number(p.mrp||0)}</p>
  <p>Stock: ${Number(p.stock||0)}</p>
  <p>${p.is_active===false?"INACTIVE":"ACTIVE"}</p>
  <div class="actions">
   <button class="yellow" onclick="editProduct('${escapeHTML(p.id)}')">Edit</button>
   <button class="gray" onclick="toggleProduct('${escapeHTML(p.id)}')">${p.is_active===false?"Activate":"Hide"}</button>
   <button class="red" onclick="deleteProduct('${escapeHTML(p.id)}')">Delete</button>
  </div>
 </div>
 `).join("") || "<p>No products found.</p>";
}

function editProduct(id){
 const p=products.find(x=>String(x.id)===String(id));
 if(!p)return;

 el("editId").value=p.id;
 el("name").value=p.name||"";
 el("category").value=p.category||"CLOTHING";
 el("brand").value=p.brand||"";
 el("price").value=p.price||"";
 el("mrp").value=p.mrp||"";
 el("stock").value=p.stock??0;
 el("delivery").value=p.delivery||"7-10 DAYS";
 el("returnPolicy").value=p.returnPolicy||"15 DAYS";
 el("imageUrl").value=p.image||p.image_url||"";
 el("description").value=p.description||"";
 el("isActive").checked=p.is_active!==false;

 previewImage();
 el("formTitle").textContent="✏️ Edit Product";
 el("saveBtn").textContent="Update Product";
 window.scrollTo({top:0,behavior:"smooth"});
}

async function toggleProduct(id){
 const p=products.find(x=>String(x.id)===String(id));
 if(!p)return;

 const {error}=await db.from("products")
 .update({is_active:p.is_active===false})
 .eq("id",id);

 if(error){alert(error.message);return}
 await loadProducts();
}

async function deleteProduct(id){
 if(!confirm("Are you sure you want to delete this product?"))return;

 const {error}=await db.from("products").delete().eq("id",id);

 if(error){
  alert("Delete failed: "+error.message);
  return;
 }

 await loadProducts();
}

checkSession();
</script>
</body>
</html>
